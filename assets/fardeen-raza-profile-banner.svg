<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="530" viewBox="0 0 1600 530" role="img" aria-labelledby="title desc">
  <title id="title">Fardeen Raza — Software Developer</title>
  <desc id="desc">Minimalist midnight-blue coding banner with Fardeen Raza branding and a luminous code symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02060D"/>
      <stop offset=".62" stop-color="#061426"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".62" stop-color="#DDEEFF"/>
      <stop offset="1" stop-color="#67BFFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5F3FF"/>
      <stop offset=".28" stop-color="#74C8FF"/>
      <stop offset=".65" stop-color="#1685F5"/>
      <stop offset="1" stop-color="#064AAB"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BB8FF"/>
      <stop offset="1" stop-color="#06336F"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D3FF4D"/>
      <stop offset="1" stop-color="#A9E834"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#087FEA" stop-opacity=".42"/>
      <stop offset="1" stop-color="#087FEA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="bright" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#007BEE" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="530" fill="url(#bg)"/>
  <ellipse cx="1300" cy="280" rx="420" ry="330" fill="url(#glow)" filter="url(#softBlur)"/>
  <path d="M1040 530C1200 390 1325 250 1600 120" fill="none" stroke="#007DF0" stroke-opacity=".12" stroke-width="110"/>
  <path d="M0 430C270 555 520 500 770 410S1230 305 1600 405" fill="none" stroke="#0B72D4" stroke-opacity=".10" stroke-width="3"/>
  <path d="M0 445C270 570 520 515 770 425S1230 320 1600 420" fill="none" stroke="#3CAEFF" stroke-opacity=".65" stroke-width="2"/>
  <path d="M0 446C270 571 520 516 770 426S1230 321 1600 421" fill="none" stroke="#3CAEFF" stroke-opacity=".26" stroke-width="12" filter="url(#softBlur)"/>

  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <g transform="translate(100 95)">
      <circle cx="10" cy="0" r="5" fill="#B9E85A"/>
      <text x="32" y="7" fill="#AFBED0" font-size="21" letter-spacing="2.2">razacodes-any</text>
    </g>

    <text x="92" y="286" fill="url(#type)" font-size="112" font-weight="760" letter-spacing="-5">Fardeen Raza</text>
    <rect x="100" y="324" width="112" height="7" rx="3.5" fill="url(#lime)"/>
    <text x="100" y="388" fill="#F2F6FB" font-size="34" font-weight="620">Software Developer</text>
    <circle cx="493" cy="377" r="5" fill="#B9E85A"/>
    <text x="522" y="388" fill="#AAB8C9" font-size="31" font-weight="420">Computer Science Graduate</text>
    <text x="101" y="455" fill="#AFC0D3" font-size="25" letter-spacing=".2">DSA</text>
    <circle cx="177" cy="447" r="3.5" fill="#B9E85A"/>
    <text x="207" y="455" fill="#AFC0D3" font-size="25">Web Development</text>
    <circle cx="447" cy="447" r="3.5" fill="#B9E85A"/>
    <text x="477" y="455" fill="#AFC0D3" font-size="25">Machine Learning</text>
    <circle cx="737" cy="447" r="3.5" fill="#B9E85A"/>
    <text x="767" y="455" fill="#AFC0D3" font-size="25">Projects</text>
  </g>

  <g transform="translate(1195 258)" filter="url(#shadow)">
    <ellipse cx="0" cy="170" rx="250" ry="28" fill="#087FEA" opacity=".22" filter="url(#softBlur)"/>
    <path d="M-155 -65L-230 16L-155 97L-119 59L-159 16L-119 -27Z" fill="url(#blueSide)" stroke="#A8E2FF" stroke-width="2"/>
    <path d="M-155 -65L-230 16L-155 97L-144 84L-207 16L-144 -51Z" fill="#D7F4FF" opacity=".5"/>
    <path d="M-28 -126L-109 132L-55 132L25 -126Z" fill="url(#blue)" stroke="#D9F4FF" stroke-width="2"/>
    <path d="M-28 -126L25 -126L-55 132L-109 132Z" fill="#47AFFF" opacity=".26"/>
    <path d="M155 -65L230 16L155 97L119 59L159 16L119 -27Z" fill="url(#blueSide)" stroke="#A8E2FF" stroke-width="2"/>
    <path d="M155 -65L230 16L155 97L144 84L207 16L144 -51Z" fill="#D7F4FF" opacity=".5"/>
    <path d="M-155 -65L-230 16L-155 97M-28 -126L-109 132M155 -65L230 16L155 97" fill="none" stroke="#E4FAFF" stroke-opacity=".8" stroke-width="2" filter="url(#bright)"/>
  </g>

  <path d="M1170 0C1295 90 1410 105 1600 48" fill="none" stroke="#168BFF" stroke-opacity=".65" stroke-width="3"/>
  <path d="M1170 0C1295 90 1410 105 1600 48" fill="none" stroke="#168BFF" stroke-opacity=".22" stroke-width="20" filter="url(#softBlur)"/>
</svg>